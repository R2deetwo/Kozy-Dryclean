  <!-- Scoop neckline (deeper than the Shirt collar — no placket) -->
  <path d="M12 5 C12.3 8 13.8 9.6 16 9.6 C18.2 9.6 19.7 8 20 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>
  <!-- Gold bow accent at the neckline centre -->
