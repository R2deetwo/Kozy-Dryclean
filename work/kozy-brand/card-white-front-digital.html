<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:#FFFFFF; }
  .poster { width:321.26px; height:207.87px; position:relative; background:#FFFFFF; }
  .bleedbox { position:absolute; inset:0px; background:#FFFFFF; overflow:hidden; }
  .trim { position:absolute; inset:0px; }
  .marks { position:absolute; left:0; top:0; pointer-events:none; }
  .content { position:absolute; inset:0; padding:24px 24px 20px;
             display:flex; flex-direction:column; font-family:'Outfit', Arial, sans-serif;
             color:#0A192F; }
  .frame { position:absolute; inset:16px; border:1px solid rgba(212,175,55,.65); border-radius:2px;
            pointer-events:none; }
  .deco { position:absolute; top:-70px; right:-70px; opacity:.5; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center;
             justify-content:center; }
  .name { font-family:'Playfair Display', Georgia, serif; font-weight:700;
           font-size:23px; letter-spacing:2.2px; color:#0A192F; line-height:1; }
  .desc { font-family:'Marcellus', 'Times New Roman', serif; font-size:6.8px;
           letter-spacing:2.3px; color:#8A6D1E; margin-top:7px; white-space:nowrap; }
  .rule { width:46px; height:1px; background:#D4AF37; margin-top:11px; }
  .tagline { font-family:'Playfair Display', Georgia, serif; font-style:italic;
              font-weight:500; font-size:9.5px; color:#46618A; margin-top:10px;
              letter-spacing:.3px; }
  .headrow { display:flex; align-items:center; gap:9px; }
  .headrow .hn { font-family:'Playfair Display', Georgia, serif; font-weight:700;
                  font-size:14.5px; letter-spacing:1.6px; color:#0A192F; line-height:1; }
  .rows { display:flex; flex-direction:column; gap:11px; margin-top:2px; }
  .lbl { font-family:'Marcellus', 'Times New Roman', serif; font-size:6.4px;
          letter-spacing:1.7px; color:#8A6D1E; }
  .val { font-size:10.5px; font-weight:500; color:#0A192F; letter-spacing:.4px;
          margin-top:2.5px; }
  .qrbox { width:78px; padding:3px; background:#FFFFFF; border-radius:5px;
            border:1px solid #D4AF37; }
  .qrbox img { width:100%; display:block; }
  .scan { font-family:'Marcellus', 'Times New Roman', serif; font-size:6.4px;
           letter-spacing:1.7px; color:#8A6D1E; text-align:center; margin-top:5px; }
  .mid { display:flex; justify-content:space-between; align-items:center;
          flex:1; padding-right:6px; }
  .addrrule { height:1px; background:rgba(212,175,55,.55); margin:0 2px; }
  .addr { font-size:6.6px; color:#6F88A8; letter-spacing:.5px; text-align:center;
           margin-top:6.5px; white-space:nowrap; }
