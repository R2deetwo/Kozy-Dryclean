<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; }

  .dark { background:#0A192F; }
  .cream { background:#F5F1E8; }
  img { height:64px; }
  .lbl { font:11px Arial; color:#6B7280; letter-spacing:2px; margin-bottom:14px; }
</style></head>
<body>
  <div class="cell cream"><div class="lbl">PRIMARY NAVY (on cream)</div><img src="kozy-logo-primary-navy.svg"></div>
  <div class="cell dark"><div class="lbl">PRIMARY WHITE (on navy)</div><img src="kozy-logo-primary-white.svg"></div>
  <div class="cell cream"><div class="lbl">COMPACT GOLD (on cream)</div><img src="kozy-logo-compact-gold.svg"></div>
  <div class="cell dark"><div class="lbl">PRINT CAPS WHITE (on navy)</div><img src="kozy-logo-print-caps-white.svg"></div>
</body>
</html>
